spring.application.name=IntraSpace
# Port du serveur backend
server.port=8080

# Configuration PostgreSQL — Neon (cloud)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Hibernate (JPA) : Met à jour les tables automatiquement
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ── Email (Gmail SMTP) ───────────────────────────────────────
# Replace with your Gmail address and App Password (not your regular password)
# To get an App Password: Google Account > Security > 2-Step Verification > App passwords
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your.email@gmail.com
spring.mail.password=your_app_password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ── JWT ──────────────────────────────────────────────────────
app.jwt.secret=IntraSpaceSecretKeyMustBeAtLeast32CharsLongForHMAC!
app.jwt.expiration=86400000


# Liquibase configuration
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

# ── File Upload ──────────────────────────────────────────────
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.upload.dir=uploads/hr-documents

# ── RAG Pipeline ─────────────────────────────────────────────
# Ollama (default) — change to OpenAI URL if needed
rag.embedding.url=http://localhost:11434/api/embeddings
rag.embedding.model=nomic-embed-text
rag.embedding.dimension=768
rag.chunk.size=500
rag.chunk.overlap=50

# ── Chatbot / LLM (Text-to-SQL + RAG réponses) ───────────────
# Ollama local par défaut — remplacer par OpenAI ou Mistral si besoin :
#   OpenAI  : rag.chat.url=https://api.openai.com/v1/chat/completions
#   Mistral : rag.chat.url=https://api.mistral.ai/v1/chat/completions
rag.chat.url=http://localhost:11434/api/chat
rag.chat.model=llama3
