spring.application.name=IntraSpace
# Port du serveur backend
server.port=8080

# Configuration PostgreSQL (Neon Tech Cloud)
spring.datasource.url=${DB_URL:jdbc:postgresql://ep-wild-meadow-atpuyrok-pooler.c-9.us-east-1.aws.neon.tech/neondb?sslmode=require}
spring.datasource.username=${DB_USERNAME:neondb_owner}
spring.datasource.password=${DB_PASSWORD:npg_oKZv04LxlsFt}

# Hibernate (JPA) : Met à jour les tables automatiquement
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ── Email (Gmail SMTP) ───────────────────────────────────────
# Replace with your Gmail address and App Password (not your regular password)
# To get an App Password: Google Account > Security > 2-Step Verification > App passwords
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ── JWT ──────────────────────────────────────────────────────
app.jwt.secret=IntraSpaceSecretKeyMustBeAtLeast32CharsLongForHMAC!
app.jwt.expiration=86400000


# Liquibase configuration
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

# ── Spring AI & pgvector ─────────────────────────────────────
spring.ai.mistralai.api-key=${MISTRAL_API_KEY}

# Active la création automatique de la table vectorielle 'vector_store' par Spring AI
spring.ai.vectorstore.pgvector.initialize-schema=true
