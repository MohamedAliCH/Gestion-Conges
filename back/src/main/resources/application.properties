spring.application.name=IntraSpace
# Port du serveur backend
server.port=8080

# Configuration PostgreSQL (Neon Tech Cloud)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Hibernate (JPA) : Met à jour les tables automatiquement
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ── Email (Gmail SMTP) ───────────────────────────────────────
# Replace with your Gmail address and App Password (not your regular password)
# To get an App Password: Google Account > Security > 2-Step Verification > App passwords
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:noreply@intraspace.com}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ── JWT ──────────────────────────────────────────────────────
app.jwt.secret=IntraSpaceSecretKeyMustBeAtLeast32CharsLongForHMAC!
app.jwt.expiration=86400000


# Liquibase configuration
# Set to true only when you add new changesets; false skips 4 cloud DB round-trips (~3s saved)
spring.liquibase.enabled=${LIQUIBASE_ENABLED:false}
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

# ── File Upload ──────────────────────────────────────────────
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.upload.dir=uploads/hr-documents

# ── RAG Pipeline (chunking) ───────────────────────────────────
rag.chunk.size=500
rag.chunk.overlap=50

# ── Spring AI & pgvector ─────────────────────────────────────
spring.ai.mistralai.api-key=${MISTRAL_API_KEY}

# Schema is already created; set to true only the first time or after wiping the DB (~1.7s saved)
spring.ai.vectorstore.pgvector.initialize-schema=false
# Mistral embed produit des vecteurs de 1024 dimensions (pas 1536 comme OpenAI)
spring.ai.vectorstore.pgvector.dimensions=1024
