spring.application.name=IntraSpace
# Port du serveur backend
server.port=8080

# Configuration PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/gestion_conges_db
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

# Hibernate (JPA) : Met à jour les tables automatiquement
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ── Email (Gmail SMTP) ───────────────────────────────────────
# Replace with your Gmail address and App Password (not your regular password)
# To get an App Password: Google Account > Security > 2-Step Verification > App passwords
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your.email@gmail.com
spring.mail.password=your_app_password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ── JWT ──────────────────────────────────────────────────────
app.jwt.secret=IntraSpaceSecretKeyMustBeAtLeast32CharsLongForHMAC!
app.jwt.expiration=86400000
