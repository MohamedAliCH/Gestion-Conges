spring.application.name=IntraSpace

# ── H2 Embedded Database ─────────────────────────────────────
spring.datasource.url=jdbc:h2:file:./data/intraspace
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=


# ── JPA / Hibernate ─────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ── Email (Gmail SMTP) ───────────────────────────────────────
# Replace with your Gmail address and App Password (not your regular password)
# To get an App Password: Google Account > Security > 2-Step Verification > App passwords
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your.email@gmail.com
spring.mail.password=your_app_password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ── JWT ──────────────────────────────────────────────────────
app.jwt.secret=IntraSpaceSecretKeyMustBeAtLeast32CharsLongForHMAC!
app.jwt.expiration=86400000
